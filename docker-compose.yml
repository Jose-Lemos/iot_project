services:
  # Base de Datos
  postgres:
    image: postgres:16-alpine
    container_name: iot_postgres
    restart: always
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      POSTGRES_DB: iot_data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U iot_user -d iot_data"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplica el esquema antes de iniciar los servicios Django
  migrate:
    build: ./backend
    working_dir: /app
    environment:
      DB_ENGINE: postgresql
    command: python manage.py migrate --noinput
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # Broker MQTT
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iot_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    # Forzamos a que use el archivo de configuración y escuche en todas las interfaces
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # Backend Django
  backend:
    build: ./backend
    container_name: iot_backend
    restart: always
    environment:
      DB_ENGINE: postgresql
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Worker MQTT (El que escucha al ESP8266 y guarda en DB)
  mqtt_worker:
      build: ./backend
      container_name: iot_mqtt_worker
      restart: always
      working_dir: /app
      # Configuramos PYTHONPATH para que encuentre 'iot_project'
      environment:
        PYTHONPATH: /app
        DB_ENGINE: postgresql
        MQTT_BROKER: mosquitto
        TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
        TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      # Ejecutamos el script de forma persistente
      command: python api/mqtt_listener.py
      volumes:
        - ./backend:/app
      depends_on:
        mosquitto:
          condition: service_started
        postgres:
          condition: service_healthy
        migrate:
          condition: service_completed_successfully

  # Frontend Nginx (Vital-Air)
  frontend:
    image: nginx:alpine
    container_name: iot_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  pgdata: