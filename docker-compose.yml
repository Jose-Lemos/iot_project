services:
  # Base de Datos
  postgres:
    image: postgres:16-alpine
    container_name: iot_postgres
    restart: always
    environment:
      POSTGRES_USER: "${DB_USER:-iot_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}"
      POSTGRES_DB: "${DB_NAME:-iot_data}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplica el esquema antes de iniciar los servicios Django
  migrate:
    build: ./backend
    working_dir: /app
    environment:
      DB_ENGINE: postgresql
      DB_NAME: "${DB_NAME:-iot_data}"
      DB_USER: "${DB_USER:-iot_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}"
      CREATE_DEMO_USER: "${CREATE_DEMO_USER:-false}"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      if [ \"$$CREATE_DEMO_USER\" = 'true' ]; then
      python manage.py create_demo_user; fi"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # Broker MQTT
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iot_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    # Forzamos a que use el archivo de configuración y escuche en todas las interfaces
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # Backend Django
  backend:
    build: ./backend
    container_name: iot_backend
    restart: always
    environment:
      DB_ENGINE: postgresql
      DB_NAME: "${DB_NAME:-iot_data}"
      DB_USER: "${DB_USER:-iot_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Worker MQTT (El que escucha al ESP8266 y guarda en DB)
  mqtt_worker:
      build: ./backend
      container_name: iot_mqtt_worker
      restart: always
      working_dir: /app
      # Configuramos PYTHONPATH para que encuentre 'iot_project'
      environment:
        PYTHONPATH: /app
        DB_ENGINE: postgresql
        DB_NAME: "${DB_NAME:-iot_data}"
        DB_USER: "${DB_USER:-iot_user}"
        DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}"
        DB_HOST: postgres
        DB_PORT: "5432"
        DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
        DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
        DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
        CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}"
        MQTT_BROKER: mosquitto
        TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
        TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      # Ejecutamos el script de forma persistente
      command: python apps/api/mqtt_listener.py
      volumes:
        - ./backend:/app
      depends_on:
        mosquitto:
          condition: service_started
        postgres:
          condition: service_healthy
        migrate:
          condition: service_completed_successfully

  # Frontend Nginx (Vital-Air)
  frontend:
    image: nginx:alpine
    container_name: iot_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  pgdata: